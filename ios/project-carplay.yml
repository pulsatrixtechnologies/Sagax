# Sagax in CarPlay (docs/ios-carplay.md): the build flag for the CarPlay
# screen. Only once Apple has granted the entitlement to the team and the
# App ID has the CarPlay capability:
#
#   cd ios && xcodegen generate --spec project-carplay.yml
#
# It is project.yml plus three things, merged by XcodeGen's `include`:
#   - the voice-based conversational entitlement (iOS 26.4),
#   - the CarPlay scene (CarPlaySceneDelegate) beside the app's window,
#   - SAGAX_CARPLAY in the Swift conditions, for code that wants to know.
# Without this file (plain `xcodegen generate`), the build is the usual one:
# Siri and CallKit work in the car, no icon on the CarPlay screen. Signing
# a build with this entitlement and no CarPlay profile fails, which is the
# point: it cannot ship by accident.
include:
  - project.yml

targets:
  Sagax:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SAGAX_CARPLAY
    entitlements:
      properties:
        com.apple.developer.carplay-voice-based-conversation: true
    info:
      properties:
        # The app's window stays SwiftUI's (no configuration for that role);
        # the car's screen is a template scene.
        UIApplicationSceneManifest:
          # one window, as without this file (iPad keeps its behaviour)
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
