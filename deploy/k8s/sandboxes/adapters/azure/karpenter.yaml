# AKS Karpenter (node auto-provisioning). vnetSubnetID is filled in the
# change record. podPidsLimit stays at the platform default: 512 is the
# sandbox's own limit, and a node-wide 512 can break the CNI pods.
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: sandboxes
spec:
  imageFamily: Ubuntu
  osDiskSizeGB: 64
  vnetSubnetID: REPLACE_SUBNET_ID
  kubelet:
    maxPods: 30
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandboxes
spec:
  template:
    metadata:
      labels:
        sagax.io/pool: sandboxes
    spec:
      taints:
        - key: sagax.io/pool
          value: sandboxes
          effect: NoSchedule
      expireAfter: 720h
      terminationGracePeriod: 10m
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.azure.com/sku-family
          operator: In
          values: ["D"]
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: sandboxes
  # 4 vCPU matches one <VM_SIZE>, the most the 2026-10-12 quota
  # leaves beside the production VM. Raise it only in a reviewed change record.
  limits:
    cpu: "4"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
