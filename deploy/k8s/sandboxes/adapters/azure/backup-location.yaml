# Off-site from the node disks: an Azure Blob container. The account name
# is filled in the change record. The credential is a secret named
# velero-azure, key cloud, created outside git.
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: sandboxes
  namespace: velero
spec:
  provider: azure
  objectStorage:
    bucket: sagax-sandbox-backups
    prefix: example
  credential:
    name: velero-azure
    key: cloud
  config:
    resourceGroup: <RESOURCE_GROUP>
    storageAccount: REPLACE_STORAGE_ACCOUNT
