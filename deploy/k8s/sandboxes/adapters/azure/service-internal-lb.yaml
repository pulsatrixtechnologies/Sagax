# Internal load balancer so the production VM can reach the provisioner without a
# public address. The Service in the base stays ClusterIP until this patch
# is applied.
apiVersion: v1
kind: Service
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: sagax-sandboxd
  ports:
    - name: http
      port: 8791
      targetPort: http
