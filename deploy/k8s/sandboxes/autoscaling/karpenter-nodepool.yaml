# Portable Karpenter NodePool. nodeClassRef is a placeholder; an adapter
# replaces group and kind (Azure: karpenter.azure.com / AKSNodeClass).
# Do not install this and cluster-autoscaler on the same nodes.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandboxes
spec:
  template:
    metadata:
      labels:
        sagax.io/pool: sandboxes
    spec:
      taints:
        - key: sagax.io/pool
          value: sandboxes
          effect: NoSchedule
      expireAfter: 720h
      terminationGracePeriod: 10m
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      nodeClassRef:
        group: karpenter.k8s.sagax.invalid
        kind: NodeClass
        name: sandboxes
  limits:
    cpu: "16"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
