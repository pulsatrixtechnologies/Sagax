# The provisioner creates and execs only inside this namespace. It cannot
# read Secrets (the HMAC key is mounted, not fetched) and it is not a
# cluster admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log", "pods/status"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
subjects:
  - kind: ServiceAccount
    name: sagax-sandboxd
    namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sagax-sandboxd
