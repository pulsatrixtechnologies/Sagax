# Egress for sagax-sandboxd only: the Kubernetes API (443 or 6443) and
# ingress on the signed provisioner port. Sandbox Pods do not carry this
# label, so they do not inherit the allow. Apply this before the default
# deny policy, or the provisioner loses the API on the next request.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      app: sagax-sandboxd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8791
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
