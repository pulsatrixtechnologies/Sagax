# Least privilege for sagax-sandboxd. No cluster administrator binding.
# sagax-sandbox-workload has no Role and does not mount a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sagax-sandbox-workload
  namespace: sandboxes
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
# Only the verbs server/sandboxd-k8s/sandboxd-k8s.ts uses. Exec keeps `get` and `create`:
# the websocket upgrade is a GET and is still refused without `get` (checked
# on Kubernetes 1.35). No
# patch on Pods or NetworkPolicies, no log reads, no LimitRange. What the
# provisioner may exec into and which NetworkPolicies it may write is
# bounded further by the chart's admission.provisionerGuard.
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # patch: the paused annotation on the claim
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
subjects:
  - kind: ServiceAccount
    name: sagax-sandboxd
    namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sagax-sandboxd
---
# Read StorageClass parameters to check the encryption advertisement.
# No other cluster object is in scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sagax-sandboxd-storage
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sagax-sandboxd-storage
subjects:
  - kind: ServiceAccount
    name: sagax-sandboxd
    namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sagax-sandboxd-storage
---
# The readiness check reads its own namespace (GET /api/v1/namespaces/<ns>),
# a cluster-scoped object: this one namespace by name, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sagax-sandboxd-namespace-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["sandboxes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sagax-sandboxd-namespace-read
subjects:
  - kind: ServiceAccount
    name: sagax-sandboxd
    namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sagax-sandboxd-namespace-read
