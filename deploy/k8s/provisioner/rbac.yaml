# Least privilege for sagax-sandboxd. No cluster administrator binding.
# sagax-sandbox-workload has no Role and does not mount a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sagax-sandbox-workload
  namespace: sandboxes
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sagax-sandboxd
  namespace: sandboxes
subjects:
  - kind: ServiceAccount
    name: sagax-sandboxd
    namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sagax-sandboxd
---
# Read StorageClass parameters to check the encryption advertisement.
# No other cluster object is in scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sagax-sandboxd-storage
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sagax-sandboxd-storage
subjects:
  - kind: ServiceAccount
    name: sagax-sandboxd
    namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sagax-sandboxd-storage
