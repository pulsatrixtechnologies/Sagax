apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sagax-server.name" . }}-edge
  labels:
    {{- include "sagax-server.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {{ .Values.domain }} {
      encode zstd gzip
      handle /hooks/* {
        reverse_proxy 127.0.0.1:8800
      }
      handle {
        reverse_proxy 127.0.0.1:8799 {
          flush_interval -1
        }
      }
    }
