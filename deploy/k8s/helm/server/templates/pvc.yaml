apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sagax-server.name" . }}-data
  labels:
    {{- include "sagax-server.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.data.storageClass }}
  storageClassName: {{ .Values.data.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.data.size }}
