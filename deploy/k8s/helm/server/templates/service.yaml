apiVersion: v1
kind: Service
metadata:
  name: {{ include "sagax-server.name" . }}
  labels:
    {{- include "sagax-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sagax-server.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
    - name: https
      port: {{ .Values.service.httpsPort }}
      targetPort: https
