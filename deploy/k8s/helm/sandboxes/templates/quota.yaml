apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandboxes
  namespace: {{ .Values.sandboxNamespace | quote }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    requests.storage: {{ .Values.quota.requestsStorage | quote }}
    persistentvolumeclaims: {{ .Values.quota.persistentVolumeClaims | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sandboxes
  namespace: {{ .Values.sandboxNamespace | quote }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- $lr := .Values.limitRange | default dict }}
      max:
        cpu: {{ (index $lr "maxCpu" | default .Values.sandbox.cpu) | quote }}
        memory: {{ (index $lr "maxMemory" | default .Values.sandbox.memory) | quote }}
      default:
        cpu: {{ .Values.sandbox.cpu | quote }}
        memory: {{ .Values.sandbox.memory | quote }}
      defaultRequest:
        cpu: {{ .Values.sandbox.cpu | quote }}
        memory: {{ .Values.sandbox.memory | quote }}
    - type: PersistentVolumeClaim
      max:
        storage: {{ (index $lr "maxStorage" | default .Values.sandbox.workspace) | quote }}
