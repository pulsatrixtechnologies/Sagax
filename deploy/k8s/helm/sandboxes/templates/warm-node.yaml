{{- if .Values.warmNode.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagax-sandbox-warmer
  namespace: {{ .Values.systemNamespace | quote }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
    app.kubernetes.io/name: sagax-sandbox-warmer
spec:
  {{- /* 2026-10-19 (production): an upgrade during the day put the scaled-up
  warmer back to the chart's 0, the node pool fell to 0 and every routine
  waited for a cold node. The CronJobs own the count once installed. */}}
  {{- $live := lookup "apps/v1" "Deployment" .Values.systemNamespace "sagax-sandbox-warmer" }}
  replicas: {{ if and $live $live.spec }}{{ $live.spec.replicas | default 0 }}{{ else }}{{ .Values.warmNode.replicas }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sagax-sandbox-warmer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sagax-sandbox-warmer
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml .Values.warmNode.nodeSelector | nindent 8 }}
      tolerations:
        - key: {{ .Values.warmNode.tolerationKey | quote }}
          operator: Equal
          value: {{ .Values.warmNode.tolerationValue | quote }}
          effect: NoSchedule
      {{- with .Values.warmNode.prepullImages }}
      # Pull the sandbox images onto the warm node so a cold pod start does not
      # wait on the registry. Each image must be digest-pinned and listed in
      # admission.allowedImages.
      initContainers:
        {{- range $i, $img := . }}
        - name: prepull-{{ $i }}
          image: {{ $img | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exit 0"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
      {{- end }}
      containers:
        - name: pause
          image: {{ .Values.warmNode.pauseImage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 16Mi
{{- if .Values.warmNode.spare.enabled }}
---
# Reserve: whole nodes held for the next person. The pause pod requests
# most of a node, so no sandbox shares it, and its negative priority lets the
# scheduler evict it the moment a sandbox needs the room: the person starts
# on a warm node that already has the image, and the autoscaler adds a node
# for the reserve in the background. Without it, a pool with one node per
# person makes each arrival wait for a new node.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: sagax-sandbox-spare
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
value: {{ .Values.warmNode.spare.priority | int }}
preemptionPolicy: Never
globalDefault: false
description: "Sagax sandbox reserve: evicted first, never evicts anything."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagax-sandbox-spare
  namespace: {{ .Values.systemNamespace | quote }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
    app.kubernetes.io/name: sagax-sandbox-spare
spec:
  {{- /* Same rule as the warmer: the CronJobs own the count once installed. */}}
  {{- $liveSpare := lookup "apps/v1" "Deployment" .Values.systemNamespace "sagax-sandbox-spare" }}
  replicas: {{ if and $liveSpare $liveSpare.spec }}{{ $liveSpare.spec.replicas | default 0 }}{{ else }}{{ .Values.warmNode.spare.offHoursReplicas }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sagax-sandbox-spare
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sagax-sandbox-spare
    spec:
      priorityClassName: sagax-sandbox-spare
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        runAsGroup: 65535
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        {{- toYaml (merge (deepCopy .Values.warmNode.spare.nodeSelector) .Values.warmNode.nodeSelector) | nindent 8 }}
      tolerations:
        - key: {{ .Values.warmNode.tolerationKey | quote }}
          operator: Equal
          value: {{ .Values.warmNode.tolerationValue | quote }}
          effect: NoSchedule
        {{- with .Values.warmNode.spare.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      # One reserve per node, whatever the node size.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: sagax-sandbox-spare
              topologyKey: kubernetes.io/hostname
      {{- with .Values.warmNode.prepullImages }}
      initContainers:
        {{- range $i, $img := . }}
        - name: prepull-{{ $i }}
          image: {{ $img | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exit 0"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
      {{- end }}
      containers:
        - name: pause
          image: {{ .Values.warmNode.pauseImage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: {{ .Values.warmNode.spare.cpu | quote }}
              memory: {{ .Values.warmNode.spare.memory | quote }}
            limits:
              cpu: {{ .Values.warmNode.spare.cpu | quote }}
              memory: {{ .Values.warmNode.spare.memory | quote }}
{{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sagax-sandbox-warm-up
  namespace: {{ .Values.systemNamespace | quote }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.warmNode.scaleUp | quote }}
  timeZone: {{ .Values.warmNode.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sagax-sandbox-warmer
        spec:
          serviceAccountName: sagax-sandbox-warmer
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scale
              image: {{ .Values.warmNode.kubectlImage | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - scale
                - deployment/sagax-sandbox-warmer
                - --replicas={{ .Values.warmNode.upReplicas }}
                - -n
                - {{ .Values.systemNamespace | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
            {{- if .Values.warmNode.spare.enabled }}
            - name: scale-spare
              image: {{ .Values.warmNode.kubectlImage | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - scale
                - deployment/sagax-sandbox-spare
                - --replicas={{ .Values.warmNode.spare.businessHoursReplicas }}
                - -n
                - {{ .Values.systemNamespace | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
            {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sagax-sandbox-warm-down
  namespace: {{ .Values.systemNamespace | quote }}
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.warmNode.scaleDown | quote }}
  timeZone: {{ .Values.warmNode.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sagax-sandbox-warmer
        spec:
          serviceAccountName: sagax-sandbox-warmer
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scale
              image: {{ .Values.warmNode.kubectlImage | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - scale
                - deployment/sagax-sandbox-warmer
                - --replicas=0
                - -n
                - {{ .Values.systemNamespace | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
            {{- if .Values.warmNode.spare.enabled }}
            - name: scale-spare
              image: {{ .Values.warmNode.kubectlImage | quote }}
              imagePullPolicy: IfNotPresent
              command:
                - kubectl
                - scale
                - deployment/sagax-sandbox-spare
                - --replicas={{ .Values.warmNode.spare.offHoursReplicas }}
                - -n
                - {{ .Values.systemNamespace | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
            {{- end }}
{{- end }}
