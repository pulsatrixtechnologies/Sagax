{{- if .Values.admission.validating }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxes-images
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: images
      expression: |
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: allowed
      expression: {{ include "sandboxes.allowedImages" . | quote }}
  validations:
    - expression: |
        variables.images.all(c,
          !c.image.endsWith(':latest') &&
          (
            c.image.startsWith('ghcr.io/pulsatrixtechnologies/') ||
            variables.allowed.exists(a, a == c.image)
          )
        )
      message: "Images must be signed Pulsatrix images or a digest-pinned operational image, and must not use the latest tag."
    - expression: |
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false) &&
        (!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))) &&
        variables.images.all(c,
          (!has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false) &&
          (!has(c.securityContext) || !has(c.securityContext.allowPrivilegeEscalation) || c.securityContext.allowPrivilegeEscalation == false)
        )
      message: "Sandbox pods cannot be privileged, escalate, use the host network, or mount a host path (including the Docker socket)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxes-images
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  policyName: sandboxes-images
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - {{ .Values.sandboxNamespace | quote }}
            - {{ .Values.systemNamespace | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxes-placement
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: |
        has(object.spec.nodeSelector) &&
        object.spec.nodeSelector['sagax.io/pool'] == 'sandboxes' &&
        has(object.spec.tolerations) &&
        object.spec.tolerations.exists(t,
          t.key == 'sagax.io/sandboxes' && t.effect == 'NoSchedule'
        )
      message: "Sandbox pods must run on the sagax.io/pool=sandboxes pool."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxes-placement
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  policyName: sandboxes-placement
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.sandboxNamespace | quote }}
    {{- with .Values.admission.placementObjectSelector }}
    # The provisioner shares this namespace: only sandbox pods must sit on the sandbox pool.
    objectSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- if .Values.admission.dedicated.enabled }}
---
# One node and one user namespace per person (SAGAX_SANDBOX_K8S_HOST_USERS=false,
# SAGAX_SANDBOX_K8S_DEDICATED_NODE=1). Warn while people move one at a time,
# then Deny once the provisioner gives it to everyone.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxes-dedicated
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    objectSelector:
      matchExpressions:
        - key: com.pulsatrix.sagax.sandbox.user
          operator: Exists
  validations:
    - expression: "has(object.spec.hostUsers) && object.spec.hostUsers == false"
      message: "Sandbox pods must run in a user namespace (hostUsers: false)."
    - expression: |
        has(object.spec.affinity) && has(object.spec.affinity.podAntiAffinity) &&
        has(object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution) &&
        object.spec.affinity.podAntiAffinity.requiredDuringSchedulingIgnoredDuringExecution.exists(t,
          t.topologyKey == 'kubernetes.io/hostname' &&
          has(t.labelSelector) && has(t.labelSelector.matchExpressions) &&
          t.labelSelector.matchExpressions.exists(e,
            e.key == 'com.pulsatrix.sagax.sandbox.user' && e.operator == 'Exists'
          )
        )
      message: "Sandbox pods must keep every other sandbox off their node (required pod anti-affinity on kubernetes.io/hostname)."
    - expression: {{ printf "has(object.spec.nodeSelector) && %s in object.spec.nodeSelector && object.spec.nodeSelector[%s] == %s" (squote .Values.admission.dedicated.nodeLabelKey) (squote .Values.admission.dedicated.nodeLabelKey) (squote .Values.admission.dedicated.nodeLabelValue) | quote }}
      message: "Sandbox pods must select the pool with one node per person."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxes-dedicated
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
spec:
  policyName: sandboxes-dedicated
  validationActions: {{ .Values.admission.dedicated.validationActions | toJson }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.sandboxNamespace | quote }}
{{- end }}
{{- end }}
{{- if .Values.admission.kyverno.enabled }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sandboxes-verify-images
  labels:
    {{- include "sandboxes.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Sagax sandbox image signature and scan
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: {{ .Values.admission.kyverno.failureAction | quote }}
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature-and-scan
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces:
                - {{ .Values.sandboxNamespace | quote }}
                - {{ .Values.systemNamespace | quote }}
      exclude:
        any:
          - resources:
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["sagax-sandbox-warmer", "sagax-sandbox-spare"]
      verifyImages:
        - imageReferences:
            - ghcr.io/pulsatrixtechnologies/*
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: {{ .Values.admission.kyverno.issuer | quote }}
                    subjectRegExp: {{ .Values.admission.kyverno.subjectRegExp | quote }}
          attestations:
            - predicateType: https://cosign.sigstore.dev/attestation/vuln/v1
              conditions:
                - all:
                    - key: {{ `"{{ scanner.result.Summary.Critical }}"` | quote }}
                      operator: LessThanOrEquals
                      value: 0
                    - key: {{ `"{{ scanner.result.Summary.High }}"` | quote }}
                      operator: LessThanOrEquals
                      value: 0
    - name: deny-other-images
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces:
                - {{ .Values.sandboxNamespace | quote }}
                - {{ .Values.systemNamespace | quote }}
      validate:
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: {{ `"{{ regex_match('^ghcr.io/pulsatrixtechnologies/', element.image) }}"` | quote }}
                    operator: Equals
                    value: false
                  - key: {{ `"{{ element.image }}"` | quote }}
                    operator: AnyNotIn
                    value:
                      {{- include "sandboxes.allowedImages" . | fromJsonArray | toYaml | nindent 22 }}
            message: "Image is not a signed Pulsatrix image and is not on the operational allowlist."
{{- end }}
