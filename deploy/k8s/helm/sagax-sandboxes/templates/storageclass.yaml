apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.className | quote }}
  labels:
    {{- include "sagax-sandboxes.labels" . | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: {{ .Values.storage.provisioner | quote }}
reclaimPolicy: {{ .Values.storage.reclaimPolicy | quote }}
volumeBindingMode: {{ .Values.storage.volumeBindingMode | quote }}
allowVolumeExpansion: {{ .Values.storage.allowExpansion }}
parameters:
  {{- range $key, $value := .Values.storage.parameters }}
  {{- if ne ($value | toString) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
