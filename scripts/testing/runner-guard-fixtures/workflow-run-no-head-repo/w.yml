on:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  a:
    if: (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64]
    steps: [{run: "true"}]
