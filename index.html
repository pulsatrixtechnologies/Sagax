<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sagax" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sagax</title>
    <script>
      (function () {
        var SKINS = ["pulsatrix", "pulsatrix-light", "midnight", "atelier", "foundry", "lagoon", "graphite", "linen", "dusk", "daylight", "retro98", "meadow"];
        // Auto (src/lib/skin-families.ts): a variant's light and dark skins.
        var PAIRS = {"pulsatrix-light":["pulsatrix-light","pulsatrix"],"pulsatrix":["pulsatrix-light","pulsatrix"],"daylight":["daylight","midnight"],"midnight":["daylight","midnight"],"linen":["linen","graphite"],"graphite":["linen","graphite"],"atelier":["atelier","foundry"],"foundry":["atelier","foundry"]};
        var d = "pulsatrix";
        var s, m;
        try {
          s = localStorage.getItem("omb-skin");
          m = localStorage.getItem("omb-skin-mode");
        } catch (e) {}
        s = SKINS.indexOf(s) >= 0 ? s : d;
        if (m === "auto" && PAIRS[s]) {
          var k = false;
          try {
            k = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
          s = PAIRS[s][k ? 1 : 0];
        }
        document.documentElement.dataset.skin = s;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
