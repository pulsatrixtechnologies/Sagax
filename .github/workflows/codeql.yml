name: CodeQL

# Advanced setup replacing CodeQL default setup. Default setup has no
# concurrency control, so it queued one analysis per pushed commit. A repo
# admin must switch default setup off (Settings > Code security > CodeQL
# analysis) once this lands, or both will run.
#
# javascript-typescript, actions and python run on ubuntu-latest. Swift runs
# on macos-latest, and only from a manual dispatch.
#
# Results upload unless the repository variable CODEQL_ADVANCED_UPLOAD is
# "false". While default setup is still on, GitHub rejects the SARIF upload;
# set that variable to "false" until default setup is off. Query and
# extraction errors still fail the job.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin needs a Gradle build with the Android SDK; not included yet.
        include:
          - { language: javascript-typescript, build-mode: none }
          - { language: actions, build-mode: none }
          - { language: python, build-mode: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ vars.CODEQL_ADVANCED_UPLOAD != 'false' && 'always' || 'never' }}

  analyze-swift:
    # Swift needs a macOS runner and a build (no build-mode none for Swift).
    # It runs only from a manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    name: analyze (${{ matrix.language }})
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        include:
          - { language: swift, build-mode: autobuild }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ vars.CODEQL_ADVANCED_UPLOAD != 'false' && 'always' || 'never' }}
