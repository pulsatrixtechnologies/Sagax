name: image gate

# Check an already-built image with the same manifest gate production uses.
# This workflow never deploys and never contacts a host. The host deploy is
# deploy/example/deploy-server.sh, which refuses a short engine set, smoke-tests
# /healthz and the engine startup log, and on failure rolls back to
# <INSTALL_ROOT>/server-image.prev and runs:
#   docker compose up -d --force-recreate --no-deps <EDGE_SERVICE>
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image ref to check. This workflow never deploys.
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: refuse an image that is not the full engine set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the image manifest
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          node scripts/deploy-server.mjs check --image "$IMAGE"
