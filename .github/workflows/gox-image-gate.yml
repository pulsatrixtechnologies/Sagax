name: GOX image gate

# Check an already-built image against the production engine-set gate:
# the baked manifest, then each lock engine's binary (--version) in the image.
# This workflow never deploys.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image ref to check. This workflow never deploys.
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: refuse an image that is not the full engine set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the image manifest
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --entrypoint cat "$IMAGE" /app/engines/manifest.json > "$RUNNER_TEMP/engines-manifest.json"
          node scripts/engine-image-gate.mjs --manifest "$RUNNER_TEMP/engines-manifest.json" --image "$IMAGE"
