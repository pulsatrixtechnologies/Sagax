name: runner guard

on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/check-runner-labels.mjs
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    # Fork guard: a fork pull request never reaches a self-hosted runner.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: no GitHub-hosted runners
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-runner-labels.mjs
