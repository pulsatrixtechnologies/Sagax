name: runner guard

on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/check-runner-labels.mjs
      - scripts/check-runner-labels.test.mjs
      - scripts/testing/runner-guard-fixtures/**
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    name: runner labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-runner-labels.mjs .github/workflows
