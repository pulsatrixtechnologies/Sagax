name: runner guard

on:
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/check-runner-labels.mjs
      - scripts/check-runner-labels.test.mjs
      - scripts/testing/runner-guard-fixtures/**
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  guard:
    if: (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    name: no GitHub-hosted runners
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-runner-labels.mjs
      - run: node --test scripts/check-runner-labels.test.mjs
