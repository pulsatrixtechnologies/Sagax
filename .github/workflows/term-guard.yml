# Checks pull request metadata and diff against a term list.
name: term-guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: term-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/term-guard.py
            .github/term-guard-allow-paths.txt
          sparse-checkout-cone-mode: false

      - name: Mask terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          printf '%s\n' "$FORBIDDEN_TERMS" | while IFS= read -r t; do
            t="$(printf '%s' "$t" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$t" ] && echo "::add-mask::$t"
          done
          true

      - name: Fetch PR diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! command -v curl >/dev/null 2>&1; then
            echo "::error::curl is required to read the pull request and was not found"
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to read the pull request and was not found"
            exit 1
          fi
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::GITHUB_TOKEN is required to read the pull request"
            exit 1
          fi
          api="${GITHUB_API_URL:-https://api.github.com}/repos/${REPO}"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.diff" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$RUNNER_TEMP/pr.diff" \
            "${api}/pulls/${PR}"
          echo "diff bytes: $(wc -c < "$RUNNER_TEMP/pr.diff")"
          : > "$RUNNER_TEMP/commits.jsonl"
          for page in 1 2 3; do
            hdr="$RUNNER_TEMP/commits-page.hdr"
            body="$RUNNER_TEMP/commits-page.json"
            curl -fsSL -D "$hdr" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$body" \
              "${api}/pulls/${PR}/commits?per_page=100&page=${page}"
            count="$(jq 'length' "$body")"
            if [ "$count" -gt 0 ]; then
              jq -c '.[]' "$body" >> "$RUNNER_TEMP/commits.jsonl"
            fi
            more=0
            if grep -qi 'rel="next"' "$hdr"; then more=1; fi
            if [ "$page" -eq 3 ] && [ "$more" -eq 1 ]; then
              echo "::error::This pull request has more than 3 pages of commits. Refusing to scan a partial list."
              exit 1
            fi
            if [ "$count" -lt 100 ] || [ "$more" -eq 0 ]; then
              break
            fi
          done
          echo "commits: $(wc -l < "$RUNNER_TEMP/commits.jsonl")"

      - name: Scan title, branch, commits and diff
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/ci/term-guard.py --commits "$RUNNER_TEMP/commits.jsonl" "$RUNNER_TEMP/pr.diff"
