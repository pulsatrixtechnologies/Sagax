# Checks pull request metadata and diff against a term list.
name: term-guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: term-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    if: (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check out base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/term-guard.py
            .github/term-guard-allow-paths.txt
          sparse-checkout-cone-mode: false

      - name: Mask terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          printf '%s\n' "$FORBIDDEN_TERMS" | while IFS= read -r t; do
            t="$(printf '%s' "$t" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$t" ] && echo "::add-mask::$t"
          done
          true

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.diff" "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.diff"
          echo "diff bytes: $(wc -c < "$RUNNER_TEMP/pr.diff")"
          gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[]' > "$RUNNER_TEMP/commits.jsonl"
          echo "commits: $(wc -l < "$RUNNER_TEMP/commits.jsonl")"

      - name: Scan title, branch, commits and diff
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/ci/term-guard.py --commits "$RUNNER_TEMP/commits.jsonl" "$RUNNER_TEMP/pr.diff"
