# Fails a pull request whose title, branch name, changed paths, added lines, or
# commit metadata (author/committer name and e-mail, message) contain a
# forbidden term. The term list is NOT stored in this repository: it
# is read from the FORBIDDEN_TERMS Actions secret (newline-separated).
#
# pull_request_target is used so the secret is available for pull requests
# from forks too. It is safe here because this job never checks out or runs
# code from the pull request: it checks out the BASE branch (trusted) for the
# guard script, and reads the PR's title, branch and diff only as data through
# the API. If the secret is missing the job fails (fail closed).
name: term-guard

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: term-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out base branch (trusted script only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/term-guard.py
            .github/term-guard-allow-paths.txt
          sparse-checkout-cone-mode: false

      - name: Mask terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          printf '%s\n' "$FORBIDDEN_TERMS" | while IFS= read -r t; do
            t="$(printf '%s' "$t" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$t" ] && echo "::add-mask::$t"
          done
          true

      - name: Fetch PR diff (as data)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.diff" "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.diff"
          echo "diff bytes: $(wc -c < "$RUNNER_TEMP/pr.diff")"
          gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '.[]' > "$RUNNER_TEMP/commits.jsonl"
          echo "commits: $(wc -l < "$RUNNER_TEMP/commits.jsonl")"

      - name: Scan title, branch, commits and diff
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/ci/term-guard.py --commits "$RUNNER_TEMP/commits.jsonl" "$RUNNER_TEMP/pr.diff"
